<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora Tours</title>
    <!-- link to Bootstrap files via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- link to Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation. -->
    <nav class="navbar navbar-expand-sm bg-dark" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand text-uppercase" href="./">Aurora Tours</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#main-navigation"
          aria-controls="main-navigation"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navigation">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><span class="nav-link">Packages</span></li>
            <li class="nav-item">
              <span class="nav-link">Frequently Asked Questions</span>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <!-- Hero carousel. -->
      <div id="hero-carousel" class="carousel slide" aria-label="Tour highlights" role="region">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#hero-carousel"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#hero-carousel"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#hero-carousel"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active c-item bg-dark">
            <img
              src="https://images.unsplash.com/photo-1579033461380-adb47c3eb938?auto=format&amp;fit=crop&amp;w=1964&amp;q=82"
              class="d-block w-100 c-img"
              alt="Green northern lights reflected in a lake beneath snowy mountains"
            />
            <div class="carousel-caption top-0 mt-3 mt-md-4">
              <p class="mt-3 mt-md-5 fs-3 text-uppercase">Discover the hidden world</p>
              <h1 class="display-1 fw-bolder">Aurora Tours</h1>
              <button type="button" class="btn btn-primary px-4 py-2 fs-5 mt-3 mt-md-5" data-bs-toggle="modal" data-bs-target="#booking-modal">
                Book a Tour
              </button>
            </div>
          </div>
          <div class="carousel-item c-item bg-dark">
            <img
              src="https://images.unsplash.com/photo-1516466723877-e4ec1d736c8a?auto=format&amp;fit=crop&amp;w=2134&amp;q=82"
              class="d-block w-100 c-img"
              alt="Sled dogs crossing a snowy plain under the northern lights"
            />
            <div class="carousel-caption top-0 mt-3 mt-md-4">
              <p class="mt-3 mt-md-5 fs-3 text-uppercase">The season has arrived</p>
              <p class="display-1 fw-bolder">Three Available Tours</p>
              <button type="button" class="btn btn-primary px-4 py-2 fs-5 mt-3 mt-md-5" data-bs-toggle="modal" data-bs-target="#booking-modal">
                Book a Tour
              </button>
            </div>
          </div>
          <div class="carousel-item c-item bg-dark">
            <img
              src="https://images.unsplash.com/photo-1612686635542-2244ed9f8ddc?auto=format&amp;fit=crop&amp;w=2070&amp;q=82"
              class="d-block w-100 c-img"
              alt="Northern lights over an ice-covered shoreline"
            />
            <div class="carousel-caption top-0 mt-3 mt-md-4">
              <p class="mt-3 mt-md-5 fs-3 text-uppercase">Destination activities</p>
              <p class="display-1 fw-bolder">Go Glacier Hiking</p>
              <button type="button" class="btn btn-primary px-4 py-2 fs-5 mt-3 mt-md-5" data-bs-toggle="modal" data-bs-target="#booking-modal">
                Book a Tour
              </button>
            </div>
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#hero-carousel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#hero-carousel"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </main>

    <!-- Booking modal. -->
    <div class="modal fade" id="booking-modal" tabindex="-1" aria-labelledby="booking-title" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="booking-title">Book a Tour</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" disabled>Checkout</button>
          </div>
        </div>
      </div>
    </div>

    <!-- link to BootStrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
