<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap-CDN</title>
    <!-- link to Bootstrap files via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- link to Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation. -->
    <nav class="navbar navbar-expand-sm bg-dark" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand text-uppercase" href="./">Aurora Tours</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#main-navigation"
          aria-controls="main-navigation"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navigation">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><span class="nav-link">Packages</span></li>
            <li class="nav-item">
              <span class="nav-link">Frequently Asked Questions</span>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <!-- Hero carousel. -->
      <div id="hero-carousel" class="carousel slide" aria-label="Tour highlights" role="region">
        <div class="carousel-inner">
          <div class="carousel-item active c-item bg-dark">
            <img
              src="https://images.unsplash.com/photo-1579033461380-adb47c3eb938?auto=format&amp;fit=crop&amp;w=1964&amp;q=82"
              class="d-block w-100 c-img"
              alt="Green northern lights reflected in a lake beneath snowy mountains"
            />
          </div>
          <div class="carousel-item c-item bg-dark">
            <img
              src="https://images.unsplash.com/photo-1516466723877-e4ec1d736c8a?auto=format&amp;fit=crop&amp;w=2134&amp;q=82"
              class="d-block w-100 c-img"
              alt="Sled dogs crossing a snowy plain under the northern lights"
            />
          </div>
          <div class="carousel-item c-item bg-dark">
            <img
              src="https://images.unsplash.com/photo-1612686635542-2244ed9f8ddc?auto=format&amp;fit=crop&amp;w=2070&amp;q=82"
              class="d-block w-100 c-img"
              alt="Northern lights over an ice-covered shoreline"
            />
          </div>
        </div>
      </div>
    </main>

    <!-- link to BootStrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
